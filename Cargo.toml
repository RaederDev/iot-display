[package]
name = "iot-display-rust"
version = "0.1.0"
edition = "2021"
description = "IOT"

[package.metadata.bundle]
name = "DogSearch"
identifier = "com.dogs.dogsearch"
version = "1.0.0"
copyright = "Copyright (c) Jane Doe 2016. All rights reserved."
category = "Developer Tool"
short_description = "Easily search for Dog photos"
resources = ["public"]

[dependencies]
anyhow = "1.0.75"
config = "0.14.0"
dioxus = { version = "0.5.1", features = ["desktop"] }
dioxus-desktop = "0.5.1"
dirs = "5.0.1"
reqwest = { version = "0.12.3", features = ["json"] }
serde = "1.0.171"
serde_json = "1.0.108"
strum = "0.26.2"
strum_macros = "0.26.2"
tokio = { version = "1.35", features = ["full"] }
