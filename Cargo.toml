[package]
name = "iot-display"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A native Wayland dashboard for Raspberry Pi"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["wayland", "glow", "accesskit", "default_fonts", "links"] }
egui_extras = { version = "=0.36.2", default-features = false, features = ["svg"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
csv = "1"
if-addrs = "0.15"
i2cdev = "0.6"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wl-realtime-ogd = "=0.1.0"

[dev-dependencies]
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server"] }
wayland-protocols-wlr = { version = "0.3", features = ["server"] }

[profile.release]
opt-level = 2
lto = "thin"
